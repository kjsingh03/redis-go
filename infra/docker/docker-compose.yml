name: veedra-infra

services:

  commerce-api:
    build:
      context: ../..
      dockerfile: services/commerce-api/Dockerfile
    container_name: veedra_commerce_api
    restart: unless-stopped
    env_file:
    - ../../services/commerce-api/.env.docker
    environment:
      NODE_ENV: production
    ports:
      - "${COMMERCE_API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - veedra_net
      
